services:
  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    container_name: atlascrm-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${ATLASCRM_DB_CONNECTION}
      Database__AutoCreateSchema: ${ATLASCRM_DB_AUTO_CREATE:-false}
      Jwt__Issuer: ${ATLASCRM_JWT_ISSUER:-AtlasCRM}
      Jwt__Audience: ${ATLASCRM_JWT_AUDIENCE:-AtlasCRM.Web}
      Jwt__SecretKey: ${ATLASCRM_JWT_SECRET:-atlascrm-super-secret-key-change-me}
      PublicLeadCapture__ApiKey: ${ATLASCRM_PUBLIC_LEAD_KEY:-change-this-public-lead-key}
      PublicLeadCapture__CompanyId: ${ATLASCRM_PUBLIC_LEAD_COMPANY_ID:-1}
      FrontendUrl: ${ATLASCRM_FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${ATLASCRM_API_PORT:-8081}:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    container_name: atlascrm-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    ports:
      - "${ATLASCRM_WEB_PORT:-3000}:3000"
    depends_on:
      - api
